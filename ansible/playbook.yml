---
- name: Configurar VM Ubuntu 24.04 para CampusCircular
  hosts: app
  become: true
  vars:
    app_user: ubuntu
    docker_image: "{{ lookup('env', 'DOCKER_IMAGE') | default('campuscircular/app:latest', true) }}"
    vnc_password: "{{ lookup('env', 'VNC_PASSWORD') | default('', true) }}"
  pre_tasks:
    - name: Verificar que se proporciono clave VNC
      ansible.builtin.assert:
        that: vnc_password | length >= 8
        fail_msg: "Define VNC_PASSWORD con al menos 8 caracteres antes de ejecutar Ansible."
  tasks:
    - name: Instalar Docker, Git, firewall e interfaz VNC
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
          - ufw
          - iptables
          - x11vnc
          - xvfb
          - xauth
        state: present
        update_cache: true

    - name: Activar Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Agregar usuario de despliegue al grupo Docker
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true

    - name: Crear directorio de configuracion VNC
      ansible.builtin.file:
        path: /etc/x11vnc
        state: directory
        mode: '0750'

    - name: Generar archivo de clave VNC
      ansible.builtin.shell: "x11vnc -storepasswd '{{ vnc_password }}' /etc/x11vnc/passwd"
      args:
        creates: /etc/x11vnc/passwd
      no_log: true

    - name: Crear servicio VNC
      ansible.builtin.copy:
        dest: /etc/systemd/system/campuscircular-vnc.service
        mode: '0644'
        content: |
          [Unit]
          Description=CampusCircular VNC
          After=network.target
          [Service]
          ExecStart=/usr/bin/x11vnc -create -rfbport 5901 -rfbauth /etc/x11vnc/passwd -forever -shared -noxdamage
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
      notify: Reiniciar VNC

    - name: Permitir puertos de aplicacion con UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ['22', '80', '443', '5901']

    - name: Activar UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Permitir HTTP y HTTPS tambien con iptables
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "{{ item }}"
        jump: ACCEPT
      loop: ['80', '443']

    - name: Crear carpeta de aplicacion
      ansible.builtin.file:
        path: /opt/campuscircular
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Crear carpeta para el esquema de base de datos
      ansible.builtin.file:
        path: /opt/campuscircular/db
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Copiar esquema inicial de PostgreSQL
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../db/init.sql"
        dest: /opt/campuscircular/db/init.sql
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'

    - name: Crear compose de produccion
      ansible.builtin.copy:
        dest: /opt/campuscircular/docker-compose.yml
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
        content: |
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: campuscircular
                POSTGRES_USER: campus
                POSTGRES_PASSWORD: campus
              volumes:
                - campuscircular_db:/var/lib/postgresql/data
                - /opt/campuscircular/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
            app:
              image: {{ docker_image }}
              environment:
                PORT: 4000
                REPOSITORY_MODE: postgres
                DATABASE_URL: postgresql://campus:campus@db:5432/campuscircular
              ports:
                - "80:4000"
              depends_on:
                - db
          volumes:
            campuscircular_db:

    - name: Descargar imagen y levantar la aplicacion
      ansible.builtin.command:
        cmd: docker compose -f /opt/campuscircular/docker-compose.yml up -d
      register: compose_result
      changed_when: "'Started' in compose_result.stdout or 'Created' in compose_result.stdout or 'Pulled' in compose_result.stdout"

  handlers:
    - name: Reiniciar VNC
      ansible.builtin.systemd:
        name: campuscircular-vnc
        daemon_reload: true
        enabled: true
        state: restarted
